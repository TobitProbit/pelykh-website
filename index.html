  :root {
    --plum: #160826;
    --paper: #dce8b0;
    --ink: #2330d8;
    --pink: #ff3d8b;
    --saffron: #f5b301;
    --cream: #fff6e0;
    --poster: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --book: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --pad: clamp(1.1rem, 5vw, 4.5rem);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: hidden; }
  body { margin: 0; background: var(--plum); color: var(--cream); font-family: var(--book); font-weight: 500; font-size: 1.4rem; line-height: 1.3; overflow-x: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--saffron); outline-offset: 4px; }

  /* ---------------- the house ---------------- */
  .house { position: relative; height: 100vh; height: 100svh; min-height: 540px; overflow: hidden; background: var(--plum); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .dark { display: none; position: absolute; inset: 22% 10% auto; text-align: center; font-style: italic; font-size: 1.6rem; }
  .no-webgl .dark { display: block; }
  .no-webgl #stage { display: none; }

  .bar { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: clamp(.7rem, 2vw, 1.3rem) var(--pad); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .name { font-style: italic; font-size: clamp(1.15rem, 2.2vw, 1.6rem); text-shadow: 0 2px 10px rgba(40, 0, 20, .8); }
  .lang { display: flex; gap: .2rem; padding: .2rem; border-radius: 999px; background: rgba(22, 8, 38, .55); }
  .lang button { border: 0; background: none; border-radius: 999px; padding: .15rem .8rem; font-size: 1.15rem; }
  .lang button[aria-pressed="true"] { background: var(--cream); color: var(--plum); }

  .footlights {
    position: absolute; inset: auto 0 0 0; text-align: center; pointer-events: none;
    padding: 4.5rem var(--pad) clamp(.9rem, 2.5vh, 1.6rem);
    background: linear-gradient(to top, rgba(22, 8, 38, .94) 35%, rgba(22, 8, 38, 0));
  }
  .footlights > * { pointer-events: auto; }
  .tagline { margin: 0 auto .9rem; max-width: 30ch; font-style: italic; font-size: clamp(1.5rem, 3.4vw, 2.5rem); line-height: 1.05; text-wrap: balance; }
  .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem .8rem; }
  .acts button {
    font-family: var(--poster); font-size: clamp(.78rem, 1.6vw, .95rem); letter-spacing: .01em; line-height: 1;
    padding: .85em 1.15em; border-radius: 999px; border: 2px solid var(--cream); background: rgba(22, 8, 38, .5);
    transition: transform .12s ease;
  }
  .acts button:hover { transform: translateY(-2px) rotate(-1.5deg); }
  .acts button:active { transform: translateY(2px); }
  .acts button:disabled { opacity: .4; cursor: default; transform: none; }
  .acts #startBtn { background: var(--saffron); color: var(--plum); border-color: var(--saffron); box-shadow: 4px 4px 0 var(--pink); }
  .hint { margin: .9rem auto 0; max-width: 46ch; font-size: clamp(1.05rem, 1.9vw, 1.25rem); opacity: .9; text-wrap: balance; }
  .down { display: inline-block; margin-top: .45rem; font-style: italic; font-size: 1.15rem; text-underline-offset: .2em; }

  /* ---------------- the playbill ---------------- */
  .playbill { background: var(--paper); color: var(--ink); position: relative; overflow: hidden; }
  .marquee {
    background: var(--pink); color: var(--plum); font-family: var(--poster); font-size: clamp(1rem, 2.4vw, 1.5rem);
    white-space: nowrap; overflow: hidden; padding: .7em 0; transform: rotate(-1.2deg) scale(1.04); margin-top: -.6rem; position: relative; z-index: 2;
    box-shadow: 0 6px 0 var(--ink);
  }
  .marquee div { display: inline-flex; animation: slide 36s linear infinite; }
  .marquee span { padding-right: .5em; }
  @keyframes slide { to { transform: translateX(-50%); } }

  .sheet { padding: clamp(3.5rem, 9vw, 7rem) var(--pad); }
  h2 { font-family: var(--poster); font-weight: 400; margin: 0; font-size: clamp(2.3rem, 9.5vw, 8rem); line-height: .9; letter-spacing: -.03em; text-shadow: .055em .055em 0 var(--pink); overflow-wrap: anywhere; }
  .lede { margin: 1.4rem 0 0; max-width: 30ch; font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-style: italic; line-height: 1.15; }

  .cast { list-style: none; margin: clamp(2.5rem, 6vw, 5rem) 0 0; padding: 0; display: grid; gap: clamp(2rem, 5vw, 4rem); }
  .cast li { display: grid; grid-template-columns: minmax(0, clamp(5.5rem, 17vw, 13rem)) minmax(0, 27ch); gap: clamp(1rem, 4vw, 3.5rem); align-items: center; position: relative; }
  .cast li:nth-child(even) { margin-left: clamp(0rem, 16vw, 16rem); }
  .cast li:nth-child(3n) { margin-left: clamp(0rem, 30vw, 30rem); }
  .cast button {
    border: 0; background: none; padding: 0; font-family: var(--poster); font-size: clamp(5.5rem, 17vw, 13rem); line-height: .8;
    color: var(--c); text-shadow: .05em .05em 0 var(--ink); justify-self: start; transition: transform .15s ease;
  }
  .cast button:hover { transform: rotate(-6deg) scale(1.05); }
  .cast button.sung { animation: sing .9s ease; }
  @keyframes sing { 20% { transform: scale(.9, 1.25) rotate(-4deg); } 45% { transform: scale(1.12, .9) rotate(5deg); } 70% { transform: scale(.97, 1.08) rotate(-2deg); } }
  .voice { display: block; font-style: italic; font-size: clamp(1.6rem, 3vw, 2.6rem); line-height: 1; margin-bottom: .3em; }
  .bio { margin: 0; font-size: clamp(1.4rem, 2.5vw, 2.1rem); line-height: 1.16; }
  .stamp { display: none; position: absolute; left: clamp(1rem, 7vw, 6rem); top: 38%; transform: rotate(-11deg); font-family: var(--poster); font-size: clamp(.8rem, 1.8vw, 1.2rem); color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: .4em .6em; background: rgba(220, 232, 176, .88); pointer-events: none; white-space: nowrap; }
  .cast li.away button { opacity: .28; transform: rotate(14deg); }
  .cast li.away .stamp { display: block; }

  .bill { background: var(--pink); color: var(--plum); }
  .bill .kicker { margin: 0 0 .6rem; font-style: italic; font-size: clamp(1.5rem, 2.6vw, 2.1rem); }
  .bill h2 { color: var(--paper); text-shadow: .055em .055em 0 var(--plum); }
  .bill .by { margin: 1rem 0 0; font-weight: 700; font-size: clamp(1.4rem, 2.4vw, 1.9rem); }
  .bill .about { margin: .8rem 0 0; max-width: 34ch; font-size: clamp(1.4rem, 2.5vw, 2.1rem); line-height: 1.16; }

  .rules ul { list-style: none; margin: clamp(2rem, 5vw, 3.5rem) 0 0; padding: 0; max-width: 34ch; display: grid; gap: 1.1rem; font-size: clamp(1.45rem, 2.6vw, 2.2rem); line-height: 1.14; }
  .rules li { padding-left: 1.5em; position: relative; }
  .rules li::before { content: "★"; position: absolute; left: 0; top: .08em; color: var(--pink); font-size: .9em; }
  .rules li:nth-child(odd) { margin-left: clamp(0rem, 8vw, 7rem); }

  .elsewhere { background: var(--saffron); color: var(--plum); }
  .elsewhere h2 { text-shadow: .055em .055em 0 var(--cream); font-size: clamp(2rem, 7vw, 5.5rem); }
  .doors { margin: clamp(2rem, 5vw, 3.5rem) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: clamp(1.6rem, 4vw, 3rem) clamp(1.5rem, 5vw, 4rem); }
  .doors a { text-decoration: none; display: block; }
  .doors b { display: inline; font-family: var(--poster); font-weight: 400; font-size: clamp(1.25rem, 2.6vw, 2rem); line-height: 1.15; text-decoration: underline; text-decoration-thickness: .16em; text-underline-offset: .18em; }
  .doors span { display: block; margin-top: .55rem; font-size: clamp(1.35rem, 2.1vw, 1.75rem); font-style: italic; line-height: 1.2; max-width: 26ch; }
  .doors a:hover b { background: var(--plum); color: var(--saffron); text-decoration: none; }

  footer { background: var(--ink); color: var(--paper); padding: 2rem var(--pad) 2.4rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 2rem; font-size: 1.2rem; }
  footer p { margin: 0; }
  footer .wink { font-style: italic; }

  @media (max-width: 620px) {
    .stamp { left: 0; top: -1.6rem; font-size: .68rem; }
    .cast li:nth-child(even), .cast li:nth-child(3n), .rules li:nth-child(odd) { margin-left: 0; }
    .cast li:nth-child(even) { grid-template-columns: minmax(0, 1fr) minmax(0, clamp(5.5rem, 17vw, 13rem)); }
    .cast li:nth-child(even) button { order: 2; justify-self: end; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .marquee div { animation: none; }
    .cast button.sung { animation: none; }
    .acts button, .cast button { transition: none; }
  }
</style>
</head>
<body>

<header class="house">
  <canvas id="stage" role="img" aria-label="A small theatre stage. Six letters with eyes stand in a row waiting to sing."></canvas>
  <p class="dark" data-t="noWebgl"></p>
  <div class="bar">
    <span class="name" data-t="house">The One-Surname Theatre</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">English</button>
      <button type="button" data-lang="uk" aria-pressed="false" lang="uk">Українська</button>
    </div>
  </div>
  <div class="footlights">
    <h1 class="tagline" data-t="tagline">A surname, performed nightly by its own letters.</h1>
    <div class="acts">
      <button type="button" id="startBtn" data-t="start">Start the concert</button>
      <button type="button" id="roseBtn" data-t="rose">Throw a rose</button>
      <button type="button" id="tomatoBtn" data-t="tomato">Throw a tomato</button>
    </div>
    <p class="hint" data-t="hint">Hold a letter and it sings. Drag up for higher, sideways for a different vowel.</p>
    <a class="down" href="#playbill" data-t="toPlaybill">Read the playbill</a>
  </div>
</header>

<main class="playbill" id="playbill">
  <div class="marquee" aria-hidden="true"><div><span></span><span></span></div></div>

  <section class="sheet company">
    <h2 data-t="companyH">The company</h2>
    <p class="lede" data-t="companyP"></p>
    <ul class="cast">
      <li data-cast="P" style="--c:#f5b301"><button type="button">P</button><div><span class="voice"></span><p class="bio"></p></div></li>
      <li data-cast="E" style="--c:#ff4f9a"><button type="button">E</button><div><span class="voice"></span><p class="bio"></p></div></li>
      <li data-cast="L" style="--c:#19b98d"><button type="button">L</button><div><span class="voice"></span><p class="bio"></p></div></li>
      <li data-cast="Y" style="--c:#4f7bff"><button type="button">Y</button><div><span class="voice"></span><p class="bio"></p></div></li>
      <li data-cast="K" style="--c:#ff7a1a"><button type="button">K</button><div><span class="voice"></span><p class="bio"></p></div><span class="stamp"></span></li>
      <li data-cast="H" style="--c:#a585ff"><button type="button">H</button><div><span class="voice"></span><p class="bio"></p></div></li>
    </ul>
  </section>

  <section class="sheet bill">
    <p class="kicker" data-t="billH">On the bill tonight</p>
    <h2 data-t="billTitle">Shchedryk</h2>
    <p class="by" data-t="billBy"></p>
    <p class="about" data-t="billP"></p>
  </section>

  <section class="sheet rules">
    <h2 data-t="rulesH">House rules</h2>
    <ul id="rules"></ul>
  </section>

  <section class="sheet elsewhere">
    <h2 data-t="elsewhereH">Elsewhere in the building</h2>
    <div class="doors">
      <a href="/archive/2025-pelykh-was-here/"><b data-t="archive1T"></b><span data-t="archive1D"></span></a>
      <a href="/archive/2026-mountain-table/"><b data-t="archive2T"></b><span data-t="archive2D"></span></a>
      <a href="/valuation-course/"><b data-t="courseT"></b><span data-t="courseD"></span></a>
      <a href="mailto:l.pelykh@icloud.com"><b data-t="doorT"></b><span data-t="doorD"></span></a>
    </div>
  </section>
</main>

<footer>
  <p>© 2025–2026 Pelykh</p>
  <p class="wink" data-t="foot"></p>
</footer>
